# Example spit-fhir configuration.
db:
  # Can also be provided via the SPIT_FHIR_DB_URI environment variable
  # instead of committing a connection string here.
  uri: postgresql+psycopg://user:pass@localhost:5432/warehouse

  # All FHIR resources live in one table, uniquely keyed by (id, resource_type).
  table: fhir_resources

  # Column names, in case they ever diverge from the dbt convention.
  id_column: id
  resource_type_column: resource_type
  resource_column: resource

dewrangle:
  output_file: output/dewrangle.json
  buffer_size: 1000
